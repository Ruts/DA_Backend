# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - DABackend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Test WhatsApp, staff inbox and administration
        run: python -m unittest -v test_farmer_service test_admin_service

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            main.py
            farmer_service.py
            admin_service.py
            meta_whatsapp.py
            meta_setup.py
            whatsapp_worker.py
            worker_app.py
            yield_network.py
            requirements.txt

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_744CF2CBCA9241928464BDE48AF4F72A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_97AB242A0F204F19AB4B000F6BD21A1A }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_FF27E623E9D5408FAF46D93A6841D3EC }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'DABackend'
          slot-name: 'Production'

      - name: Deploy single-consumer WhatsApp worker
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'dabackend-whatsapp-worker'
          slot-name: 'Production'
          